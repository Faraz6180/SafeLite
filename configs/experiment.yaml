# SafeLite Experiment Configuration - FULL RESEARCH SWEEP
experiment:
  name: "safelite_full_research_sweep"
  random_seed_base: 42
  num_seeds: 30                # N=30 for statistical power
  action_horizon: 200

tasks:
  - "reach-v3"                 # Simplest
  - "push-v3"                  # Medium
  - "pick-place-v3"            # Most complex

baselines:
  B0:
    description: "Direct Action (No Safety, No Correction)"
    skip_safety: true
    skip_correction: true
  B3:
    description: "SafeLite (Verifier + Correction)"
    skip_safety: false
    skip_correction: true

llm:
  provider: "groq"
  model: "llama-3.1-8b-instant"
  temperature: 0.0
  max_tokens: 512

logging:
  raw_data_dir: "results/raw"
  log_level: "INFO"